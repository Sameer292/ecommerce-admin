project_id = "ecommerce-admin"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"
enable_signup = false
minimum_password_length = 12

[auth.email]
enabled = true

[auth.email.template.invite]
subject = "Your staff invitation"
content_path = "./supabase/templates/staff-invite.html"

[auth.email.template.recovery]
subject = "Reset your staff password"
content_path = "./supabase/templates/staff-recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
