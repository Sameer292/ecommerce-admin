services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce_admin
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_admin"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 45s

volumes:
  postgres:
