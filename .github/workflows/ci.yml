name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: unit-test-publishable
      SUPABASE_SECRET_KEY: unit-test-secret
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - file: database-workflows
            variable: TEST_WORKFLOW_DATABASE_URL
          - file: edit-conflicts
            variable: TEST_EDIT_DATABASE_URL
          - file: payment
            variable: TEST_PAYMENT_DATABASE_URL
          - file: team-access
            variable: TEST_TEAM_DATABASE_URL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: integration-test-publishable
      SUPABASE_SECRET_KEY: integration-test-secret
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Create Supabase roles in the disposable database
        run: docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Run database workflow
        run: env "$TEST_VARIABLE=$DATABASE_URL" bun test "tests/$TEST_FILE.test.ts"
        env:
          TEST_VARIABLE: ${{ matrix.variable }}
          TEST_FILE: ${{ matrix.file }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_START_APP: 1
      STORE_CURRENCY: USD
      E2E_ADMIN_EMAIL: browser-admin@example.test
      E2E_VIEWER_EMAIL: browser-viewer@example.test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Start local Supabase
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          admin_password=$(openssl rand -hex 24)
          viewer_password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$SECRET_KEY" "$admin_password" "$viewer_password"
          {
            printf 'DATABASE_URL=%s\n' "$DB_URL"
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'E2E_ADMIN_PASSWORD=%s\n' "$admin_password"
            printf 'E2E_VIEWER_PASSWORD=%s\n' "$viewer_password"
          } >> "$GITHUB_ENV"
      - run: bun run db:migrate
      - run: bun run db:lock-currency
      - run: bun run db:seed
      - run: bun scripts/seed-browser-staff.ts
      - run: bun run build
      - run: bun run test:e2e --workers=1
